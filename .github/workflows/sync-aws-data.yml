name: Sync AWS data

# Weekly refresh of public/data from the AWS Service Reference (scripts/sync-aws-data.ts).
# Real mode is schedule or workflow_dispatch on main, and nothing else. It commits to chore/aws-data-sync
#   (force-updated) and opens or updates one PR to main. It never pushes to main: merging deploys production,
#   so the owner merges.
# Every other run is a dry run: the same sync, test and build, then it prints the would-be PR. That covers a
#   push to feat/** touching this workflow or the sync script, and a dispatch from any ref other than main.
# Two jobs: `sync` (read-only token) fetches, tests and builds. `publish` (write token, real mode only) commits
#   the data that `sync` uploaded, and opens or updates the PR. The write token never runs npm code.
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:
  push:
    branches: ["feat/**"]
    paths:
      - .github/workflows/sync-aws-data.yml
      - scripts/sync-aws-data.ts

permissions:
  contents: read

concurrency:
  group: sync-aws-data-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash # bash -eo pipefail: a failing command inside a pipeline fails the step

env:
  REAL_MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
  SYNC_BRANCH: chore/aws-data-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      title: ${{ steps.changes.outputs.title }}
    steps:
      - name: Dry run on a non-main dispatch
        if: github.event_name == 'workflow_dispatch' && env.REAL_MODE != 'true'
        run: echo "::notice::Dispatched from ${GITHUB_REF}, not main. Running as a dry run; nothing will be pushed."
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A failing sync (fetch error, curated service losing actions, >1% dropped) exits 1 with its error in this log.
      - run: npm run sync-data

      - name: Detect and summarise data changes
        id: changes
        run: |
          shopt -s inherit_errexit # a failing git diff inside $(keys ...) fails the step, not an empty list
          # index.json carries generatedAt (today), so it differs every run. If no service file changed and the
          # index differs only in that field, the data is unchanged.
          if [ -z "$(git status --porcelain --untracked-files=all -- public/data ':!public/data/index.json')" ] &&
            node -e '
              const fs = require("node:fs");
              const { execFileSync } = require("node:child_process");
              const strip = (s) => { const o = JSON.parse(s); delete o.generatedAt; return JSON.stringify(o); };
              const before = execFileSync("git", ["show", "HEAD:public/data/index.json"], { encoding: "utf8" });
              const after = fs.readFileSync("public/data/index.json", "utf8");
              process.exit(strip(before) === strip(after) ? 0 : 1);
            '; then
            git checkout -- public/data/index.json
            echo "::notice::AWS data unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A -- public/data
          keys() {
            local diff
            diff=$(git diff --cached --name-status --diff-filter="$1" -- public/data/svc)
            [ -n "$diff" ] || return 0
            awk '{ n = split($2, p, "/"); sub(/\.json$/, "", p[n]); print p[n] }' <<< "$diff" | sort | paste -sd, - | sed 's/,/, /g'
          }
          added=$(keys A); removed=$(keys D); changed=$(keys M)
          stat=$(git diff --cached --shortstat -- public/data | sed 's/^ *//')
          title="chore(data): weekly AWS data sync ($(date -u +%F))"
          out="$RUNNER_TEMP/sync-out"
          mkdir -p "$out"
          {
            echo "Weekly refresh of \`public/data\` from the AWS Service Reference (\`npm run sync-data\`)."
            echo
            echo "- **Added services:** ${added:-none}"
            echo "- **Removed services:** ${removed:-none}"
            echo "- **Changed services:** ${changed:-none}"
            echo
            echo "\`git diff --stat\`: ${stat}"
            echo
            echo "The sync job opens this PR only after \`npm test\` and \`npm run build\` pass on this data."
            echo "PRs opened with \`GITHUB_TOKEN\` don't trigger other workflows, so CI for this PR runs when you push or re-run."
            echo
            echo "Generated by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$out/pr-body.md"
          { echo "changed=true"; echo "title=${title}"; } >> "$GITHUB_OUTPUT"

      # A data change that breaks the engine fails the job here, so no PR is opened.
      - if: steps.changes.outputs.changed == 'true'
        run: npm test
      - if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Print the would-be PR
        if: steps.changes.outputs.changed == 'true'
        env:
          TITLE: ${{ steps.changes.outputs.title }}
        run: |
          if [ "$REAL_MODE" = "true" ]; then
            echo "Real mode: the publish job will force-push ${SYNC_BRANCH} and open or update this PR to main."
          else
            echo "DRY RUN: would force-push ${SYNC_BRANCH} and open or update this PR to main."
          fi
          echo "Title: ${TITLE}"
          echo "----"
          cat "$RUNNER_TEMP/sync-out/pr-body.md"
          { echo "### Would-be PR (real mode: ${REAL_MODE})"; echo; echo "**${TITLE}**"; echo
            cat "$RUNNER_TEMP/sync-out/pr-body.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage the synced data for the publish job
        if: steps.changes.outputs.changed == 'true' && env.REAL_MODE == 'true'
        run: cp -r public/data "$RUNNER_TEMP/sync-out/data"
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.changed == 'true' && env.REAL_MODE == 'true'
        with:
          name: aws-data-sync
          path: ${{ runner.temp }}/sync-out/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: sync
    # Real mode only, and only when the data changed and test and build passed.
    if: needs.sync.outputs.changed == 'true' && ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aws-data-sync
          path: ${{ runner.temp }}/sync-out
      - name: Commit, push and open or update the PR
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ needs.sync.outputs.title }}
        run: |
          body="$RUNNER_TEMP/sync-out/pr-body.md"
          rm -rf public/data
          cp -r "$RUNNER_TEMP/sync-out/data" public/data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          git add -A -- public/data
          git commit -m "$TITLE"
          git push --force origin "$SYNC_BRANCH"
          pr=$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$TITLE" --body-file "$body"
            echo "::notice::Updated PR #${pr}"
          elif ! gh pr create --head "$SYNC_BRANCH" --base main --title "$TITLE" --body-file "$body"; then
            echo "::error::Pushed ${SYNC_BRANCH} but could not open the PR. Enable Settings > Actions > General >" \
              "'Allow GitHub Actions to create and approve pull requests', or open it by hand:" \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${SYNC_BRANCH}"
            exit 1
          fi
