name: Export tooling

# Layer 4 (spec §11): run the real tools on every exporter's output for the reference and variant cases.
# The checks themselves live in scripts/check-exports.sh so they run identically locally.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHELLCHECK_VERSION: 0.9.0
      SHELLCHECK_SHA256: 700324c6dd0ebea0117591c6cc9d7350d9c7c5c287acbad7630fa17b1d4d9e2f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run export-fixtures
      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }} (official release)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "SHELLCHECK=$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Terraform plugin cache location and weekly key
        id: tfcache
        run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # The provider constraint and its lower bound live in terraform.ts; the week picks up new provider releases.
      - uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-plugins-${{ runner.os }}-1.9.8-${{ hashFiles('src/core/export/terraform.ts') }}-${{ steps.tfcache.outputs.week }}
          restore-keys: |
            tf-plugins-${{ runner.os }}-1.9.8-${{ hashFiles('src/core/export/terraform.ts') }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cfn-lint, botocore, PyYAML, ruff
        run: python -m pip install cfn-lint==1.57.2 botocore==1.43.114 pyyaml==6.0.3 ruff==0.17.1
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Force -Scope CurrentUser
      - name: Check exports (ruff, file sets, shellcheck, PowerShell, terraform, cfn-lint, YAML, CLI model)
        run: bash scripts/check-exports.sh
        env:
          CFN_LINT: cfn-lint
          PYTHON: python
          RUFF: ruff
