name: Export tooling

# Layer 4 (spec §11): run the real tools on every exporter's output for the reference and variant cases.
# The checks themselves live in scripts/check-exports.sh so they run identically locally.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run export-fixtures
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cfn-lint, botocore, PyYAML
        run: python -m pip install cfn-lint==1.57.2 botocore==1.43.114 pyyaml==6.0.3
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
      - name: Check exports (shellcheck, PSScriptAnalyzer, terraform, cfn-lint, CLI model)
        run: bash scripts/check-exports.sh
        env:
          CFN_LINT: cfn-lint
          PYTHON: python
